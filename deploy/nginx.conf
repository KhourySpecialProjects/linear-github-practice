# Serves the rendered site from stage 2 of the Dockerfile.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML is never cached, so a redeploy is visible on the next refresh.
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    # text/html is always gzipped and must not be repeated here.
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # Container liveness probe, kept out of the access log so it does not
    # drown the interesting lines.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # dist/ is rebuilt from scratch in every image, so assets can be cached
    # hard for the lifetime of a deployment.
    #
    # Gotcha worth knowing: an `add_header` in a location block *replaces* the
    # inherited server-level ones, so the security headers are repeated here.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # `$uri/` is what makes /jane-doe/ resolve to /jane-doe/index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
