# Instructor-owned: instructors edit this file, students never do (students only
# add bios/<slug>.yml). Add, remove or rename teams freely - nothing in the code
# hardcodes how many there are, and the site groups by whatever is listed here,
# in this order.
#
# A bio whose `team` does not match one of these names still renders, in a
# trailing "Unassigned" group, and `python -m generator validate` reports it.
