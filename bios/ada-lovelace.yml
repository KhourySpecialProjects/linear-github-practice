about: |
  I translate mathematical ideas into instructions a machine can follow, and I care
  just as much about the **explanation** as the result. My notes on Charles Babbage's
  Analytical Engine ran longer than the paper they annotated, because a program nobody
  can read is a program nobody can trust.

  What I bring to a team:

  - A written plan before the first line of code
  - Patience for the boring parts of correctness
  - Enthusiasm for pairing on hard problems

  Outside of work I read about music theory and keep a running list of things the
  engine might do beyond arithmetic. If you want the long version, the
  [original memoir](https://en.wikisource.org/wiki/Scientific_Memoirs/3/Sketch_of_the_Analytical_Engine)
  is still the best introduction.
fun_fact: Wrote the first published computer program for a machine that was never built.
