name: Katherine Johnson
team: Team Falcon
headline: Orbital mechanics and trajectory analysis, verified by hand
pronouns: she/her
location: Hampton, Virginia
about: |
  I compute the trajectories that put people in orbit and bring them home again. When
  the first electronic computers took over the arithmetic, the crew still asked me to
  check the numbers by hand, and I did, because a launch window is not the place to
  discover a rounding error.

  I ask to be in the room where the decision happens, I show my work, and I expect the
  same from the people reviewing mine.
